<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaudulla National Park - Explore Nearby</title>
  <link rel="icon" type="image/png" href="../favicon_io/favicon.png?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {margin:0;font-family:'Inter',sans-serif;background:#f7fafd;color:#222;}
    .container {max-width:900px;margin:40px auto;padding:32px;background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,0.07);}
    h1 {font-family:'Playfair Display',serif;font-size:2.2rem;color:#1a3557;margin-bottom:18px;}
    .search-bar {display:flex;gap:12px;margin-bottom:24px;}
    .search-bar input {flex:1;padding:12px 16px;border-radius:8px;border:1px solid #ccc;font-size:1rem;}
    .search-bar button {padding:12px 24px;border-radius:8px;background:#ff914d;color:#fff;font-weight:600;border:none;cursor:pointer;}
    .map-section {margin:32px 0;}
    iframe {width:100%;height:380px;border-radius:12px;border:0;}
    .directions {margin-top:18px;}
    .directions a {display:inline-block;padding:10px 22px;background:#1a3557;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;transition:.2s;}
    .directions a:hover {background:#ff914d;}
    .back-link {display:inline-block;margin-top:32px;padding:10px 24px;background:#ff914d;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;transition:.2s;}
    .back-link:hover {background:#ffb37a;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Kaudulla National Park</h1>
    <div class="search-bar">
      <input type="text" id="place-search-kaudulla" placeholder="Search for places near Kaudulla..." />
      <button onclick="searchNearbyKaudulla()">Search</button>
    </div>
    <div class="map-section">
      <iframe id="gmap-kaudulla" src="https://www.google.com/maps?q=Kaudulla%20National%20Park%2C%20Sri%20Lanka&output=embed" allowfullscreen loading="lazy"></iframe>
    </div>
    <div class="directions">
      <a href="https://www.google.com/maps/dir/?api=1&destination=Kaudulla+National+Park%2C+Sri+Lanka" target="_blank" rel="noopener">Get Directions</a>
    </div>
    <a href="elephant-gathering-activity.html" class="back-link">&#8592; Back to Activities</a>
  </div>
  <script>
    function searchNearbyKaudulla() {
      var query = document.getElementById('place-search-kaudulla').value;
      if(query) {
        var map = document.getElementById('gmap-kaudulla');
        map.src = 'https://www.google.com/maps?q=' + encodeURIComponent(query + ' near Kaudulla National Park, Sri Lanka') + '&output=embed';
      }
    }
  </script>
</body>
</html>
